server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # the files of a remote app are requested by the host apps from another origin (fonts and remotes.json need CORS)
  # note: add_header is not inherited by a location that has its own add_header, that's why it's repeated below
  add_header Access-Control-Allow-Origin * always;

  # hashed files never change, so they are cached forever
  # quoted because the regex contains curly braces
  location ~* "\.[0-9a-f]{8}\.(js|css)$" {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # files without a hash must be revalidated, otherwise the host apps would keep loading an old version of the app
  location ~* ^/(index\.html|remoteEntry\.js|remotes\.json)$ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-cache";
  }

  # single page app: unknown routes are handled by react router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
